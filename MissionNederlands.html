  {type:'write',skill:'Écrire',prompt:'Complète la liste avec le modèle : « een … » (une pomme). Écris seulement le nom du fruit.',model:'appel',answers:['appel'],explain:'Le fruit se dit « appel ».',lex:'appel'}]},
 {id:'p5-finale',year:'P5',icon:'🎁',title:'Le rendez-vous secret',place:'Mission finale P5',story:'La boîte révèle un rendez-vous. Rassemble l’heure, le lieu et ce qu’il faut apporter.',culture:'Une même information peut être donnée par un plan, une affiche ou une conversation. Cherche les indices utiles dans chaque support.',steps:[
  {type:'listen',skill:'Écouter',prompt:'À quelle heure commence le rendez-vous ?',audio:'We spreken af om drie uur.',choices:['À 15 h','À 13 h','À 17 h'],answer:0,explain:'« Om drie uur » signifie à trois heures.',lex:'drie uur'},
  {type:'read',skill:'Lire',prompt:'Le billet dit : « Neem je boek mee. » Que dois-tu apporter ?',choices:['Ton livre','Ton ballon','Ta gourde'],answer:0,explain:'« Je boek » : ton livre ; « neem mee » : apporte.',lex:'het boek'},
  {type:'dialog',skill:'Parler',prompt:'Sam demande « Kom je zaterdag? ». Réponds à voix haute, puis choisis.',audio:'Kom je zaterdag?',choices:['Ja, ik kom zaterdag.','Ik heb een appel.','Het regent.'],answer:0,explain:'Tu confirmes que tu viens samedi.',lex:'ja, ik kom'},
  {type:'write',skill:'Écrire',prompt:'Complète le rendez-vous avec le modèle : « zaterdag ». Écris le jour.',model:'zaterdag',answers:['zaterdag'],explain:'Le jour est « zaterdag ».',lex:'zaterdag'}]},
 {id:'p6-tram',year:'P6',icon:'🚋',title:'Le trajet de Lina',place:'Transport et ville',story:'Lina possède le dernier morceau d’une carte. Retrouve-la en suivant son trajet.',culture:'Sur un plan de transports, repère d’abord la destination et l’arrêt, puis vérifie l’heure. Cette stratégie sert aussi dans la vie réelle.',steps:[
  {type:'listen',skill:'Écouter',prompt:'Quel transport prend Lina et où descend-elle ?',audio:'Ik neem de tram. Ik stap uit bij het museum.',choices:['Le tram, au musée','Le bus, au parc','Le train, à l’école'],answer:0,explain:'« De tram » ; « ik stap uit bij het museum » : je descends près du musée.',lex:'de tram'},
  {type:'read',skill:'Lire',prompt:'Lis : « De tram vertrekt om half elf. » À quelle heure part-il ?',choices:['10 h 30','11 h 30','10 h 00'],answer:0,explain:'« Half elf » correspond à 10 h 30 en néerlandais.',lex:'half elf'},
  {type:'dialog',skill:'Parler',prompt:'Demande où se trouve le musée à voix haute, puis choisis.',audio:'Kan ik je helpen?',choices:['Waar is het museum?','Ik hou van appels.','Vandaag is het warm.'],answer:0,explain:'« Waar is het museum? » demande où se trouve le musée.',lex:'waar is'},
  {type:'write',skill:'Écrire',prompt:'Lina répond : « Het museum is naast het park. » Écris une phrase pour indiquer le lieu. Tu peux utiliser le modèle.',model:'Het museum is naast het park.',answers:['het museum is naast het park','het museum ligt naast het park'],explain:'Une réponse possible : « Het museum is naast het park. »',lex:'naast het park'}]},
 {id:'p6-meteo',year:'P6',icon:'🧭',title:'Une sortie à organiser',place:'Météo et loisirs',story:'La carte conduit à une sortie. Choisis le bon moment et préviens Lina.',culture:'Pour comprendre un message, inutile de traduire chaque mot. Cherche d’abord le jour, l’heure, le lieu et l’action demandée.',steps:[
  {type:'listen',skill:'Écouter',prompt:'Quel jour est conseillé pour la sortie ?',audio:'Vrijdag regent het. Zaterdag is het zonnig. We gaan zaterdag.',choices:['Samedi','Vendredi','Lundi'],answer:0,explain:'Il pleut vendredi ; samedi est ensoleillé.',lex:'zonnig'},
  {type:'read',skill:'Lire',prompt:'Lis : « We gaan om negen uur naar het park. Neem water mee. » Que faut-il emporter ?',choices:['De l’eau','Un parapluie','Une carte'],answer:0,explain:'« Neem water mee » : emporte de l’eau.',lex:'neem water mee'},

 {id:'p6-finale',year:'P6',icon:'🗺️',title:'La carte des rencontres',place:'Mission finale P6',story:'Tu as tous les morceaux. Pour terminer, explique à Noor, Sam et Lina comment se retrouver.',culture:'La carte représente des rencontres possibles entre personnes qui parlent différentes langues. Savoir demander, écouter et reformuler aide à se comprendre.',steps:[

// Vary the correct answer's position without changing it between retries.
MISSIONS.forEach((m,mi)=>m.steps.forEach((s,i)=>{if(!s.choices)return;let shift=(mi+i)%s.choices.length,old=s.choices;s.choices=old.map((_,j)=>old[(j-shift+old.length)%old.length]);s.answer=(s.answer+shift)%old.length}));
const byId=id=>MISSIONS.find(m=>m.id===id);
const defaultState=()=>({year:'P4',view:'home',completed:{},attempts:{},review:{},notes:[],settings:{enabled:{P4:true,P5:true,P6:true},hint:true},active:null});
let state;try{state={...defaultState(),...JSON.parse(localStorage.getItem(K)||'{}')};}catch{state=defaultState()}
state.settings={...defaultState().settings,...state.settings,enabled:{...defaultState().settings.enabled,...(state.settings?.enabled||{})}};
const app=document.querySelector('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[.,!?;:]/g,'').replace(/\s+/g,' ').trim();
function save(){try{localStorage.setItem(K,JSON.stringify({...state,active:null}));}catch{}}
function setView(v){state.view=v;state.active=null;save();render()}
function currentYearMissions(){return MISSIONS.filter(m=>m.year===state.year)}
function isUnlocked(m){let a=MISSIONS.filter(x=>x.year===m.year),i=a.indexOf(m);return i===0||!!state.completed[a[i-1].id]}
function itemKey(m,i){return m.id+':'+i}
function mastery(m,i){return state.attempts[itemKey(m,i)]||{right:0,wrong:0}}
function dueItems(){let now=Date.now();return Object.entries(state.review).filter(([k,v])=>v.due<=now&&byId(k.split(':')[0])&&state.settings.enabled[byId(k.split(':')[0]).year]).map(([key,v])=>({key,...v}))}
function speak(t){if(!('speechSynthesis' in window)){alert('Lecture audio indisponible sur ce navigateur. Utilise le texte affiché.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='nl-BE';u.rate=.82;u.pitch=1;let voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase()==='nl-be')||voices.find(v=>v.lang.toLowerCase().startsWith('nl'))||null;speechSynthesis.speak(u)}
function render(){document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===state.view);b.setAttribute('aria-current',b.dataset.view===state.view?'page':'false')});({home:renderHome,review:renderReview,journal:renderJournal,teacher:renderTeacher,quest:renderQuest})[state.view]?.()}
function renderHome(){let a=currentYearMissions(),done=a.filter(m=>state.completed[m.id]).length;app.innerHTML=`<section class="hero"><div class="panel hero-main"><div class="eyebrow">L’aventure commence ici</div><h2>La carte des rencontres</h2><p>Une carte a été séparée en plusieurs morceaux. Noor, Sam et Lina ont chacun un indice. Écoute, lis et parle en néerlandais pour les réunir.</p><div class="chips"><span class="pill">🔊 Audio en néerlandais</span><span class="pill">🧩 4 défis par mission</span><span class="pill">💾 Progrès sur cet appareil</span></div></div><div class="panel hero-side"><div class="eyebrow">Ton parcours ${state.year}</div><h3>${esc(YEARS[state.year].level)}</h3><p>${esc(YEARS[state.year].summary)}</p><div class="progress" aria-label="${done} missions sur 3 terminées"><span style="width:${done/3*100}%"></span></div><p class="small">${done}/3 missions terminées · ${dueItems().length} révision(s) à faire</p></div></section><div class="yearbar" aria-label="Choisir une année">${Object.keys(YEARS).map(y=>`<button class="year ${y===state.year?'selected':''}" data-year="${y}" ${!state.settings.enabled[y]?'disabled':''}>${y} · ${esc(YEARS[y].level)}</button>`).join('')}</div><div class="notice">${esc(YEARS[state.year].writing)} Les premières missions servent à découvrir ; les suivantes réutilisent les acquis.</div><div class="subhead"><div><div class="eyebrow">Parcours ${state.year}</div><h2>Les missions</h2></div><button class="btn" data-view="review">Réviser maintenant (${dueItems().length})</button></div><div class="grid">${a.map((m,i)=>`<article class="mission ${isUnlocked(m)?'':'locked'}"><div class="row"><span class="stamp" aria-hidden="true">${m.icon}</span><span class="pill ${state.completed[m.id]?'green':isUnlocked(m)?'gold':''}">${state.completed[m.id]?'✓ Terminée':isUnlocked(m)?'Disponible':'🔒 À débloquer'}</span></div><p class="small">Étape ${i+1} · ${esc(m.place)}</p><h3>${esc(m.title)}</h3><p>${esc(m.story)}</p><div class="foot row"><button class="btn ${isUnlocked(m)?'primary':''}" data-start="${m.id}" ${!isUnlocked(m)?'disabled':''}>${state.completed[m.id]?'Rejouer':'Commencer'}</button><button class="btn" data-coop="${m.id}" ${!isUnlocked(m)?'disabled':''}>À deux</button></div></article>`).join('')}</div>`}
function startQuest(id,mode='mission',index=0,coop=false){let m=byId(id);if(!m||!state.settings.enabled[m.year]||(mode==='mission'&&!isUnlocked(m)))return;state.year=m.year;state.active={id,index,mode,coop,selected:null,checked:false,correct:false,hinted:false};state.view='quest';render()}
function renderQuest(){let q=state.active;if(!q){setView('home');return}let m=byId(q.id),s=m.steps[q.index],total=m.steps.length;let audio=s.audio?`<button class="speaker" data-speak="${esc(s.audio)}" aria-label="Écouter la phrase en néerlandais">🔊 Écouter en néerlandais</button>`:'';let body=s.type==='write'?`<div class="notice"><strong>Modèle :</strong> ${esc(s.model)}</div><label for="reply">Ta réponse</label><input id="reply" class="textentry" autocomplete="off" spellcheck="false" placeholder="Écris ici" value="${esc(q.selected??'')}" ${q.checked?'disabled':''}>`:`<div class="options">${s.choices.map((c,i)=>`<button class="option ${q.selected===i?'chosen':''} ${q.checked&&i===s.answer?'right':''} ${q.checked&&q.selected===i&&i!==s.answer?'wrong':''}" data-choice="${i}" ${q.checked?'disabled':''}>${esc(c)}</button>`).join('')}</div>`;let team=q.coop?`<div class="notice"><strong>À deux · étape ${q.index+1} :</strong> ${q.index%2===0?'Élève A écoute ou lit l’indice et l’explique. Élève B propose une réponse en néerlandais. Décidez ensemble.':'Échangez les rôles : élève B présente l’indice, élève A propose la réponse. Décidez ensemble.'}</div>`:'';app.innerHTML=`<section class="quest"><button class="btn ghost smallbtn" data-view="${q.mode==='review'?'review':'home'}">← Retour</button><div class="panel"><div class="row"><span class="pill">${m.year}</span><span class="pill">${esc(s.skill)}</span><span class="small">${q.mode==='review'?'Révision ciblée':`Étape ${q.index+1} sur ${total}`}</span></div><h2 style="margin-top:12px">${m.icon} ${esc(m.title)}</h2><div class="progress"><span style="width:${(q.index+(q.checked?1:0))/total*100}%"></span></div>${q.index===0&&q.mode==='mission'?`<p>${esc(m.story)}</p>`:''}${team}<div class="divider"></div>${audio}<div class="prompt">${esc(s.prompt)}</div>${s.type==='dialog'?'<p class="small">Parle d’abord à voix haute. Tu peux réécouter autant de fois que nécessaire.</p>':''}${body}${!q.checked?`<div class="row"><button class="btn primary" data-check>Vérifier</button>${state.settings.hint&&!q.hinted?'<button class="btn" data-hint>Un indice</button>':''}</div>${q.hinted?`<div class="notice">${s.type==='write'?'Tu peux reprendre le modèle en haut.':s.type==='dialog'?'Cherche la formule qui répond à la question.':'Repère le mot lié à la question ; réécoute si besoin.'}</div>`:''}`:`<div class="feedback ${q.correct?'':'bad'}"><strong>${q.correct?'Bien joué !':'À retravailler'}</strong><br>${esc(s.explain)}${s.type==='dialog'?'<br><span class="small">Tu as vérifié le choix de la formule ; ta prononciation n’a pas été évaluée.</span>':''}</div><button class="btn primary" data-next>${q.mode==='review'||q.index===total-1?'Terminer':'Continuer →'}</button>`}</div></section>`}
function checkAnswer(){let q=state.active;if(!q||q.checked)return;let m=byId(q.id),s=m.steps[q.index];if(s.type==='write')q.selected=document.querySelector('#reply').value;if(q.selected===null||String(q.selected).trim()===''){alert('Choisis ou écris une réponse avant de vérifier.');return}q.correct=s.type==='write'?s.answers.some(x=>normalize(x)===normalize(q.selected)):q.selected===s.answer;q.checked=true;let key=itemKey(m,q.index),a=mastery(m,q.index);state.attempts[key]={right:a.right+(q.correct?1:0),wrong:a.wrong+(q.correct?0:1)};let old=state.review[key];if(q.correct){if(old){let stage=Math.min((old.stage||0)+1,4);state.review[key]={stage,due:Date.now()+[0,86400000,3*86400000,7*86400000,14*86400000][stage]}}}else state.review[key]={stage:0,due:Date.now()};save();renderQuest()}
function nextStep(){let q=state.active;if(!q||!q.checked)return;let m=byId(q.id);if(q.mode==='review'){state.active=null;state.view='review';save();render();return}if(q.index<m.steps.length-1){state.active={...q,index:q.index+1,selected:null,checked:false,correct:false,hinted:false};renderQuest();return}state.completed[m.id]=true;state.notes=Array.from(new Set([...state.notes,...m.steps.map(s=>s.lex)]));state.active=null;state.view='journal';save();render();app.insertAdjacentHTML('afterbegin',`<div class="panel culture" style="margin-top:20px"><div class="eyebrow">Mission accomplie · ${m.year}</div><h2>${m.icon} ${esc(m.title)}</h2><p>${esc(m.culture)}</p><button class="btn primary" data-view="home">Voir les missions →</button></div>`)}
function renderReview(){let due=dueItems();let all=Object.entries(state.review).filter(([k])=>byId(k.split(':')[0]));app.innerHTML=`<section class="hero"><div class="panel hero-main"><div class="eyebrow">V2 · progression adaptée</div><h2>Mes révisions</h2><p>Les éléments qui t’ont posé problème reviennent ici. Après une réponse juste, ils reviennent plus tard : le lendemain, puis après quelques jours.</p><span class="pill gold">${due.length} à revoir maintenant</span></div><div class="panel"><h3>Comment ça marche ?</h3><p>Les erreurs reviennent immédiatement. L’application conserve les réussites sur cet appareil et espace les prochains rappels.</p><p class="small">Il n’y a ni note, ni classement, ni chrono.</p></div></section><div class="subhead"><h2>À revoir maintenant</h2></div><div class="list">${due.length?due.map(({key})=>{let [id,index]=key.split(':'),m=byId(id),s=m.steps[Number(index)];return `<div class="reviewitem"><div><strong>${m.icon} ${esc(s.lex)}</strong><div class="small">${m.year} · ${esc(s.skill)} · ${esc(m.title)}</div></div><button class="btn primary smallbtn" data-review="${esc(key)}">Réviser</button></div>`}).join(''):'<div class="panel">Aucune révision en attente. Tu peux rejouer une mission pour t’entraîner.</div>'}</div><p class="small">${all.length-due.length} élément(s) programmé(s) pour plus tard.</p>`}
function renderJournal(){let done=MISSIONS.filter(m=>state.completed[m.id]),counts=Object.keys(YEARS).map(y=>({y,n:done.filter(m=>m.year===y).length}));app.innerHTML=`<section class="hero"><div class="panel hero-main"><div class="eyebrow">V3 · carnet de voyage</div><h2>La carte des rencontres</h2><p>Chaque mission terminée complète ton carnet. Les expressions découvertes peuvent resservir dans les autres parcours.</p><div class="chips">${counts.map(x=>`<span class="pill ${x.n===3?'green':''}">${x.y} · ${x.n}/3 ${x.n===3?'✦':''}</span>`).join('')}</div></div><div class="panel culture"><h3>Découverte culturelle</h3><p>${done.length?esc(done.at(-1).culture):'Termine une mission pour découvrir une observation sur la communication en néerlandais.'}</p></div></section><div class="split"><div class="panel"><h3>Étapes franchies</h3><div class="list">${done.length?done.map(m=>`<div class="reviewitem"><span>${m.icon} <strong>${esc(m.title)}</strong> <span class="small">· ${m.year}</span></span><span class="pill green">✓</span></div>`).join(''):'<p>La première étape t’attend dans Missions.</p>'}</div></div><div class="panel"><h3>Mes expressions</h3><p class="small">Clique pour les entendre. La voix du navigateur peut varier selon l’appareil.</p><div class="chips">${state.notes.length?state.notes.map(n=>`<button class="btn smallbtn" data-speak="${esc(n)}">🔊 ${esc(n)}</button>`).join(''):'<p>Les expressions des missions terminées apparaîtront ici.</p>'}</div></div></div>`}
function renderTeacher(){let skills=['Écouter','Lire','Parler','Écrire'],counts={};for(let skill of skills)counts[skill]=[0,0];for(let m of MISSIONS.filter(m=>m.year===state.year))m.steps.forEach((s,i)=>{let a=mastery(m,i);counts[s.skill][0]+=a.right;counts[s.skill][1]+=a.wrong});app.innerHTML=`<section class="hero"><div class="panel hero-main"><div class="eyebrow">Espace enseignant · sur cet appareil</div><h2>Adapter le parcours</h2><p>Cette vue donne une indication sur les réponses aux activités. Les échanges oraux restent à observer par un adulte : un choix de formule ne prouve pas que l’enfant sait la prononcer.</p><p class="small">Les données sont locales au navigateur. Sur un appareil partagé, elles mélangent les utilisations : choisissez un profil de navigateur par élève pour un suivi individuel.</p></div><div class="panel"><h3>Années disponibles</h3>${Object.keys(YEARS).map(y=>`<label class="row" style="margin:9px 0"><input type="checkbox" data-toggle-year="${y}" ${state.settings.enabled[y]?'checked':''}> ${y} · ${esc(YEARS[y].level)}</label>`).join('')}<label class="row" style="margin-top:18px"><input type="checkbox" data-toggle-hint ${state.settings.hint?'checked':''}> Autoriser les indices</label></div></section><div class="split"><div class="panel"><h3>Activités · ${state.year}</h3><div class="yearbar">${Object.keys(YEARS).map(y=>`<button class="btn smallbtn ${state.year===y?'primary':''}" data-year="${y}">${y}</button>`).join('')}</div>${skills.map(k=>{let [good,bad]=counts[k],n=good+bad,rate=n?Math.round(good/n*100):0;return `<div class="barline"><strong>${k}</strong><div class="progress"><span style="width:${rate}%"></span></div><span class="small">${n?rate+' %':'—'}</span></div>`}).join('')}<p class="small">Pourcentage de réponses correctes parmi les tentatives sur cet appareil. « Parler » mesure le choix d’une formule après invitation à parler, pas la production orale.</p></div><div class="panel"><h3>Correspondance pédagogique</h3><p><strong>P4 :</strong> écouter, reconnaître, lire des indices courts et parler avec des formules. Pas d’écriture produite.</p><p><strong>P5 :</strong> comprendre et interagir ; écrire des mots à l’aide d’un modèle.</p><p><strong>P6 :</strong> comprendre des messages courts, échanger et écrire des phrases simples avec un modèle.</p><p class="small">Les missions proposent des situations de révision. Elles ne remplacent ni le cours ni une évaluation de compétence par l’enseignant.</p></div></div><div class="panel" style="margin-top:16px"><h3>Gestion des données</h3><p>Effacer les progrès, réponses et révisions enregistrés sur cet appareil.</p><button class="btn warn" data-reset>Effacer les données locales</button></div>`}
document.addEventListener('click',e=>{let el=e.target.closest('button');if(!el)return;if(el.dataset.view){setView(el.dataset.view);return}if(el.dataset.year){state.year=el.dataset.year;save();render();return}if(el.dataset.start){startQuest(el.dataset.start);return}if(el.dataset.coop){startQuest(el.dataset.coop,'mission',0,true);return}if(el.dataset.review){let [id,index]=el.dataset.review.split(':');startQuest(id,'review',Number(index));return}if(el.dataset.speak){speak(el.dataset.speak);return}if(el.dataset.choice!==undefined&&state.active&&!state.active.checked){state.active.selected=Number(el.dataset.choice);renderQuest();return}if(el.hasAttribute('data-check')){checkAnswer();return}if(el.hasAttribute('data-next')){nextStep();return}if(el.hasAttribute('data-hint')&&state.active){state.active.hinted=true;renderQuest();return}if(el.hasAttribute('data-reset')&&confirm('Effacer tous les progrès et réglages de cet appareil ?')){localStorage.removeItem(K);state=defaultState();render()}});
document.addEventListener('change',e=>{if(e.target.dataset.toggleYear){let y=e.target.dataset.toggleYear;if(!e.target.checked&&Object.values(state.settings.enabled).filter(Boolean).length===1){e.target.checked=true;alert('Garde au moins une année disponible.');return}state.settings.enabled[y]=e.target.checked;if(!state.settings.enabled[state.year])state.year=Object.keys(YEARS).find(x=>state.settings.enabled[x]);save();render()}if(e.target.hasAttribute('data-toggle-hint')){state.settings.hint=e.target.checked;save()}});
document.addEventListener('input',e=>{if(e.target.id==='reply'&&state.active)state.active.selected=e.target.value});
render();
</script></body></html>
